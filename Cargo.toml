[package]
name = "burn-cs3780"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

# Example binaries for each topic
# Note: Only add binary targets for examples that actually exist

# Placeholder for future examples - uncomment when files are created
# [[bin]]
# name = "decision_trees_example" 
# path = "examples/02_decision_trees/main.rs"

[dependencies]
# Core Burn dependencies
burn = { version = "0.20", features = ["ndarray", "wgpu", "std", "train"] }
burn-core = "0.20"
burn-ndarray = "0.20"
burn-wgpu = "0.20"
burn-train = "0.20"
burn-dataset = "0.20"

# Data handling and visualization
ndarray = "0.16"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math and statistics
rand = "0.8"
rand_distr = "0.4"
nalgebra = "0.33"

# Plotting and visualization (for examples)
plotters = "0.3"
image = "0.25"

# Utility
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

# Web deployment features
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"

[features]
default = ["std"]
std = ["burn/std"]
wasm-web = ["burn/wgpu"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }


